dependencies {
    implementation libs.bundles.anvillib
    interfaceInjectionData libs.anvillib.font
    jarJar libs.bundles.anvillib
    implementation(libs.jhighlight) { transitive = false }
    jarJar libs.jhighlight
    implementation(libs.jsoup) { transitive = false }
    jarJar(libs.jsoup)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) { useJUnitPlatform() }

sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}

// Verify the unpublished renderer port without replacing unrelated library modules.
if (providers.gradleProperty('anvillibRenderingJar').isPresent()) {
    configurations.configureEach {
        exclude group: 'dev.anvilcraft.lib', module: 'anvillib-rendering-neoforge-26.1'
    }
    dependencies {
        implementation files(providers.gradleProperty('anvillibRenderingJar').get())
    }
}
