plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    alias libs.plugins.modDevGradle
    alias libs.plugins.lombok
}

String buildNumber
String buildType = 'build'
if (System.getenv("CI_BUILD") == 'false') buildNumber = null
else {
    if (System.getenv("PR_BUILD") != 'false') buildType = 'pr'
    buildNumber = System.getenv("GITHUB_RUN_NUMBER")
}
def envVersion = System.getenv("GITHUB_REF")
if (envVersion != null && envVersion.startsWith("refs/tags/")) {
    version = envVersion.substring(envVersion.lastIndexOf('/') + 1)
} else {
    version = "${mod_version}" + (buildNumber != null ? "+${buildType}.${buildNumber}" : "")
}
group = maven_group

apply from: "$rootDir/gradle/scripts/moddevgradle.gradle"
apply from: "$rootDir/gradle/scripts/repositories.gradle"
apply from: "$rootDir/gradle/scripts/jars.gradle"
apply from: "$rootDir/gradle/scripts/publishing.gradle"
apply from: "$rootDir/gradle/scripts/resources.gradle"
apply from: "$rootDir/dependencies.gradle"

java.toolchain.languageVersion = JavaLanguageVersion.of(project.java_version)

sourceSets.main.resources { srcDir 'src/generated/resources' }

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

lombok {
    version = "1.18.44"
}

if (providers.gradleProperty('structureTest').isPresent() || providers.gradleProperty('layoutClientTest').isPresent()) {
    apply from: 'gradle/scripts/structure-test.gradle'
}

sourceSets {
    layoutTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

// Pure resolver/geometry regressions; no game window or third-party test framework required.
tasks.register('layoutTest', JavaExec) {
    dependsOn tasks.named('layoutTestClasses')
    classpath = sourceSets.layoutTest.runtimeClasspath
    mainClass = 'dev.anvilcraft.resource.ageratum.client.layout.LayoutRegressionTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(project.java_version) }
}
tasks.named('check') { dependsOn tasks.named('layoutTest') }
